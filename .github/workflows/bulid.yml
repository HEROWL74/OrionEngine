name: Build OrionEngine

on:
  push:
    branches: [develop, "feature/**", "refactor/**", "fix/**"]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    name: ${{ matrix.os }} Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            preset: x64-release-ci
            build-preset: editor-release-ci
          - os: ubuntu-latest
            preset: linux-release-ci
            build-preset: editor-release-ci

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # --- Windows Setup ---
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # --- Linux Setup ---
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglfw3-dev libvulkan-dev \
            vulkan-validationlayers-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master

      # --- vcpkg Setup (Unified) ---
      - name: Restore vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_installed
            ~/.cache/vcpkg # Linux用
            ${{ env.LOCALAPPDATA }}/vcpkg/archives # Windows用
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        shell: bash
        run: |
          # Linuxの場合、VCPKG_ROOTを標準の場所かカスタムパスに設定
          if [ "${{ runner.os }}" == "Linux" ]; then
            export VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT # GitHub標準のvcpkgを使用
            cmake --preset ${{ matrix.preset }} -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          else
            # Windowsはプリセット内の C:/vcpkg/... が生きていればそのまま
            cmake --preset ${{ matrix.preset }}
          fi

      - name: Build
        run: cmake --build --preset ${{ matrix.build-preset }}