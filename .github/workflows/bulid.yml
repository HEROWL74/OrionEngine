name: Build OrionEngine

on:
  push:
    branches: [develop, "feature/**", "refactor/**", "fix/**"]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    name: ${{ matrix.os }} Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: x64-release-ci
            build-preset: editor-release-ci
            use_sccache: true
          - os: ubuntu-latest
            preset: linux-release-ci
            build-preset: linux-editor-release-ci
            use_sccache: false

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # --- Windows専用: sccache セットアップ ---
      - name: Run sccache-cache
        if: matrix.use_sccache
        uses: mozilla/sccache-action@v0.0.5

      # --- Windows Setup ---
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # --- Linux Setup ---
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libglfw3-dev \
            libvulkan-dev \
            vulkan-tools \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master

      # --- vcpkg Cache ---
      - name: Restore vcpkg Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_installed
            ~/.cache/vcpkg
            ${{ env.LOCALAPPDATA }}/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        shell: bash
        env:
          # Windowsかつsccacheを使う場合のみ環境変数をセット
          CMAKE_C_COMPILER_LAUNCHER: ${{ matrix.use_sccache && 'sccache' || '' }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ matrix.use_sccache && 'sccache' || '' }}
          SCCACHE_GHA_ENABLED: ${{ matrix.use_sccache && 'true' || 'false' }}
          MSYS_NO_PATHCONV: 1 # Windowsのパス変換バグ防止
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            # Windows側は /Z7 を付与してビルド
            cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_FLAGS="/Z7" -DCMAKE_C_FLAGS="/Z7"
          else
            export VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT
            cmake --preset ${{ matrix.preset }} -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          fi

      - name: Build
        run: cmake --build --preset ${{ matrix.build-preset }}

      - name: Show sccache stats
        if: matrix.use_sccache
        run: sccache --show-stats