name: build

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop, main]

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Configure (Release preset)
      - name: Configure
        run: cmake --preset x64-release-ci

      # Editor ビルド確認
      - name: Build Editor
        run: cmake --build --preset editor-release-ci