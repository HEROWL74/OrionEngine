name: build

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop, main]

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # vcpkg セットアップ
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          runVcpkgInstall: true

      # Configure (Release preset)
      - name: Configure
        run: cmake --preset x64-release

      # Editor ビルド確認
      - name: Build Editor
        run: cmake --build --preset editor-release

      # Runtime ビルド確認
      - name: Build Runtime
        run: cmake --build --preset runtime-release
