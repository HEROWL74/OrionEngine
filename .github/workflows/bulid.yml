name: Build OrionEngine

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop, main]

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # 1. MSVC環境とWindows SDKパスをセットアップ
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master

      # 2. vcpkgのキャッシュ
      # 警告対策: vcpkgのバイナリキャッシュ場所を明示的に指定してキャッシュ効率を上げる
      - name: Set vcpkg binary cache path
        run: echo "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}/vcpkg_cache" >> $GITHUB_ENV
        shell: bash

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # 3. Configure
      - name: Configure
        run: cmake --preset x64-release-ci

      # 4. Build
      - name: Build Editor
        run: cmake --build --preset editor-release-ci