name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # vcpkg
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          runVcpkgInstall: true

      # CMake Configure
      - name: Configure (Release)
        run: cmake --preset x64-release

      # Editor build
      - name: Build Editor
        run: cmake --build --preset editor-release

      # Runtime build
      - name: Build Runtime
        run: cmake --build --preset runtime-release

      # パッケージ作成
      - name: Create OrionEngine package
        run: |
          mkdir package
          mkdir package\editor
          mkdir package\runtime
          mkdir package\engine

          copy build\x64-release\Release\OrionEditor.exe package\editor\
          copy build\x64-release\Release\OrionGame.exe package\runtime\

          xcopy assets package\engine\assets /E /I /Y

          echo { "name": "OrionEngine", "version": "${{ github.ref_name }}", "editorExecutable": "editor/OrionEditor.exe" } > package\engine.json

          powershell Compress-Archive -Path package\* -DestinationPath OrionEngine-${{ github.ref_name }}-win64.zip

      # Release upload
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: OrionEngine-${{ github.ref_name }}-win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
