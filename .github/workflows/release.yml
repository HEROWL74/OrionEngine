name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master

      - name: Configure (Release)
        run: cmake --preset x64-release-ci

      - name: Build Editor
        run: cmake --build --preset editor-release-ci

      - name: Create OrionEngine package
        shell: cmd
        run: |
          mkdir dist_package
          copy build\x64-release-ci\editor\OrionEditor.exe dist_package\
          copy build\x64-release-ci\editor\lua.dll dist_package\
          xcopy build\x64-release-ci\editor\engine-assets dist_package\engine-assets /E /I /Y
          xcopy build\x64-release-ci\editor\project dist_package\project /E /I /Y
          xcopy build\x64-release-ci\editor\project\Assets dist_package\project\Assets /E /I /Y
          xcopy build\x64-release-ci\editor\player dist_package\player /E /I /Y
          echo {"name": "OrionEngine", "version": "${{ github.ref_name }}", "editorExecutable": "OrionEditor.exe"} > dist_package\engine.json

      - name: Zip package
        shell: pwsh
        run: |
          Compress-Archive -Path dist_package\* -DestinationPath OrionEngine-${{ github.ref_name }}-win64.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: OrionEngine-${{ github.ref_name }}-win64.zip
          body: "Release ${{ github.ref_name }} - Built via CI for OrionHub."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}