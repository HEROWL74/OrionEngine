name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master

      - name: Configure (Release)
        run: cmake --preset x64-release-ci

      - name: Build Editor
        run: cmake --build --preset editor-release-ci

      - name: Create Package
        shell: cmd
        run: |
          mkdir dist
          copy build\x64-release-ci\editor\OrionEditor.exe dist\
          copy build\x64-release-ci\editor\lua.dll dist\
          copy build\x64-release-ci\editor\OrionRuntime.dll dist\
          xcopy build\x64-release-ci\editor\engine-assets dist\engine-assets /E /I /Y
          xcopy build\x64-release-ci\editor\player dist\player /E /I /Y
          xcopy build\x64-release-ci\editor\project dist\project /E /I /Y
          echo {"version": "${{ github.ref_name }}"} > dist\engine.json

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath OrionEngine-${{ github.ref_name }}.zip

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: OrionEngine-${{ github.ref_name }}.zip
          body: "Automatic Release build for version ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}